name = "citeready"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static site (landing, results, free tools, legal pages).
# The Worker runs first only for the routes listed below; everything else is served from public/.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/r/*"]

# Shared audit results (30-day TTL), waitlist signups and per-IP rate-limit counters.
# Create with:  npx wrangler kv namespace create CITEREADY_KV
# then paste the id below.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://citeready.app"
# Max audits per IP per hour
RATE_LIMIT_PER_HOUR = "30"
