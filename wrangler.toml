# Cloudflare Pages project (https://citeseen.pages.dev).
# `npm run build` copies public/ to dist/ and bundles src/index.ts into dist/_worker.js,
# which Pages runs for every request; static files are served through env.ASSETS.
name = "citeseen"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Shared audit results (30-day TTL), waitlist signups and per-IP rate-limit counters.
[[kv_namespaces]]
binding = "KV"
id = "f8ed2f2708cb48c58eaaf4a914776593"

[vars]
SITE_URL = "https://citeseen.pages.dev"
EMAIL_FROM = "CiteSeen <onboarding@resend.dev>"
# Max audits per IP per hour
RATE_LIMIT_PER_HOUR = "30"

# Users, sessions, client sites, audit history, AI checks, billing.
# Apply migrations with: npx wrangler d1 migrations apply citeseen-db --remote
[[d1_databases]]
binding = "DB"
database_name = "citeseen-db"
database_id = "caa9eefb-526d-46a1-92a4-ca82998cfd2f"
migrations_dir = "migrations"
